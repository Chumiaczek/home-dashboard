version: "3.8"

services:
  homelab-dashboard:
    build: .
    container_name: nexus-homelab-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config
      - ./public:/app/public
      - ./src:/app/src
      - ./server.js:/app/server.js
    env_file:
      - ./.env
